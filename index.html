<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acervo de Fotos</title>
<meta name="theme-color" content="#1d3557">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Acervo Fotos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#1d3557; --fundo:#f3f6f9; --papel:#ffffff; --linha:#c9d4e0;
  --suave:#4a5d73; --ok:#2d6a4f; --erro:#a4161a; --destaque:#e9eff6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font:19px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif; color:var(--tinta);
  background:var(--fundo);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 24px);
}
main{max-width:560px;margin:0 auto;padding:0 18px}
header{padding:20px 0 8px}
h1{font:500 1.75rem/1.2 Literata,Georgia,serif;margin:0 0 4px}
header p{margin:0;color:var(--suave)}
.campo{margin:22px 0}
label,.rotulo{display:block;font-weight:700;margin-bottom:8px}
.dica{font-weight:400;color:var(--suave);font-size:.9rem}
input[type=text],input[type=date],input[type=password],textarea{
  width:100%;font:inherit;color:inherit;background:var(--papel);
  border:2px solid var(--linha);border-radius:10px;padding:14px 14px;
}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:3px solid #457b9d;outline-offset:1px;border-color:#457b9d}
.eventos{display:grid;gap:10px}
.evento{
  display:flex;align-items:center;gap:14px;background:var(--papel);
  border:2px solid var(--linha);border-radius:10px;padding:14px;cursor:pointer;
}
.evento input{width:26px;height:26px;accent-color:var(--tinta);flex:none}
.evento small{display:block;color:var(--suave)}
.evento:has(input:checked){border-color:var(--tinta);background:var(--destaque)}
button{
  font:inherit;font-weight:700;border:0;border-radius:12px;cursor:pointer;
  min-height:60px;width:100%;padding:14px 18px;
}
button:focus-visible{outline:3px solid #457b9d;outline-offset:3px}
.principal{background:var(--tinta);color:#fff;font-size:1.15rem}
.principal:disabled{background:#8fa1b5}
.secundario{background:var(--papel);color:var(--tinta);border:2px solid var(--tinta)}
.escolher{
  display:flex;align-items:center;justify-content:center;gap:12px;
  border:2px dashed var(--tinta);background:var(--papel);color:var(--tinta);min-height:96px;
}
.escolher svg{width:34px;height:34px}
.previas{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.previa{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--linha)}
.previa img{width:100%;height:100%;object-fit:cover;display:block}
.previa button{
  position:absolute;top:4px;right:4px;width:36px;min-height:36px;height:36px;padding:0;
  border-radius:50%;background:rgba(29,53,87,.85);color:#fff;font-size:1.2rem;line-height:1;
}
.previa.enviada::after,.previa.falhou::after{
  content:"";position:absolute;inset:0;display:grid;place-items:center;
  font-size:2rem;color:#fff;font-weight:700;
}
.previa.enviada::after{content:"✓";background:rgba(45,106,79,.6)}
.previa.falhou::after{content:"!";background:rgba(164,22,26,.6)}
.contagem{margin:10px 0 0;color:var(--suave)}
.barra{height:14px;background:var(--linha);border-radius:7px;overflow:hidden;margin:14px 0}
.barra div{height:100%;width:0;background:var(--ok);transition:width .3s}
.aviso{padding:14px;border-radius:10px;margin:16px 0;font-weight:700}
.aviso.erro{background:#fbe9ea;color:var(--erro)}
.aviso.ok{background:#e3f1ea;color:var(--ok)}
.oculto{display:none!important}
.trocar{background:none;color:var(--suave);font-weight:400;text-decoration:underline;min-height:44px;width:auto;padding:0}
.centro{text-align:center}
.grande{font:500 1.5rem/1.3 Literata,Georgia,serif;margin:28px 0 8px}
@media (prefers-reduced-motion:reduce){.barra div{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Acervo de Fotos</h1>
    <p>Fundação Logosófica de Florianópolis</p>
  </header>

  <!-- Primeiro acesso: código -->
  <section id="telaCodigo" class="oculto">
    <div class="campo">
      <label for="codigo">Código de acesso <span class="dica">(informado pela fundação)</span></label>
      <input id="codigo" type="password" autocomplete="off" autocapitalize="off">
    </div>
    <div id="erroCodigo" class="aviso erro oculto">Código não confere. Confira com a secretaria.</div>
    <button class="principal" id="btnCodigo">Entrar</button>
  </section>

  <!-- Formulário -->
  <section id="telaForm" class="oculto">
    <div class="campo">
      <label for="autor">Seu nome completo</label>
      <input id="autor" type="text" autocomplete="name" placeholder="Ex.: Maria da Silva">
    </div>

    <div class="campo">
      <span class="rotulo">Evento</span>
      <div class="eventos" id="listaEventos"></div>
      <input id="outroEvento" type="text" class="oculto" placeholder="Nome do evento" style="margin-top:10px">
    </div>

    <div class="campo">
      <label for="data">Data das fotos</label>
      <input id="data" type="date">
    </div>

    <div class="campo">
      <label for="descricao">Comentário <span class="dica">(opcional)</span></label>
      <textarea id="descricao" placeholder="Ex.: Abertura do encontro, salão principal"></textarea>
    </div>

    <div class="campo">
      <span class="rotulo">Fotos</span>
      <input id="arquivos" type="file" accept="image/*" multiple class="oculto">
      <button class="escolher" id="btnEscolher" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 17-5-5-8 8"/></svg>
        Escolher fotos da galeria
      </button>
      <p class="contagem" id="contagem"></p>
      <div class="previas" id="previas"></div>
    </div>

    <div id="erroForm" class="aviso erro oculto"></div>
    <div id="progresso" class="oculto">
      <div class="barra"><div id="barra"></div></div>
      <p class="centro" id="textoProgresso"></p>
    </div>
    <button class="principal" id="btnEnviar" disabled>Enviar fotos</button>
    <p class="centro"><button class="trocar" id="btnSair">Trocar código de acesso</button></p>
  </section>

  <!-- Concluído -->
  <section id="telaFim" class="oculto centro">
    <p class="grande" id="textoFim">Fotos enviadas.</p>
    <p>Obrigado por contribuir com o acervo da fundação.</p>
    <div id="avisoFalhas" class="aviso erro oculto"></div>
    <button class="principal" id="btnMais" style="margin-top:20px">Enviar mais fotos</button>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const memoria = {
  get: k => { try { return localStorage.getItem(k) } catch { return null } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch {} },
  del: k => { try { localStorage.removeItem(k) } catch {} }
};
// Endereço fixo do acervo no Google (Apps Script). A página fica fora do Google e
// conversa com ele sem enviar a sessão do navegador, o que evita o erro de várias contas.
const API = "https://script.google.com/macros/s/AKfycbzczoMJVScm6i8x2QiSVbRLsrThWTPTWibuCPLFhXIjehvbYXm1dR74DUuyjmBc7InG/exec";
async function api(dados){
  const r = await fetch(API, { method: "POST", body: JSON.stringify(dados), credentials: "omit", redirect: "follow" });
  return r.json();
}
async function buscarEventos(){
  const r = await fetch(API + "?acao=eventos", { credentials: "omit", redirect: "follow" });
  return r.json();
}

let codigoAtual = "";
let fotos = [];            // {file, url, estado}
let eventos = [];

function mostrar(id){ ["telaCodigo","telaForm","telaFim"].forEach(t => $(t).classList.toggle("oculto", t !== id)); }
function hoje(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function dataBR(iso){ if(!iso) return ""; const [a,m,d] = iso.split("-"); return `${d}/${m}/${a}`; }

async function iniciar(){
  const doLink = new URLSearchParams(location.search).get("codigo") || "";
  const guardado = memoria.get("codigo") || "";
  for (const c of [doLink, guardado]) {
    if (!c) continue;
    try { if ((await api({acao: "verificar", codigo: c})).ok) { codigoAtual = c; memoria.set("codigo", c); return abrirFormulario(); } } catch {}
  }
  mostrar("telaCodigo");
}

$("btnCodigo").onclick = async () => {
  const c = $("codigo").value.trim();
  $("btnCodigo").disabled = true;
  try {
    if ((await api({acao: "verificar", codigo: c})).ok) { codigoAtual = c; memoria.set("codigo", c); $("erroCodigo").classList.add("oculto"); await abrirFormulario(); }
    else $("erroCodigo").classList.remove("oculto");
  } catch { $("erroCodigo").textContent = "Sem conexão. Tente de novo."; $("erroCodigo").classList.remove("oculto"); }
  $("btnCodigo").disabled = false;
};

async function abrirFormulario(){
  $("autor").value = memoria.get("autor") || "";
  $("data").value = hoje();
  mostrar("telaForm");
  try { eventos = await buscarEventos(); } catch { eventos = []; }
  const lista = $("listaEventos");
  lista.innerHTML = "";
  [...eventos, {id:"outro", nome:"Outro evento", data:null}].forEach(ev => {
    const el = document.createElement("label");
    el.className = "evento";
    el.innerHTML = `<input type="radio" name="evento" value="${ev.id}"><span>${ev.nome.replace(/</g,"&lt;")}${ev.data ? `<small>${dataBR(ev.data)}</small>` : ""}</span>`;
    el.querySelector("input").onchange = () => {
      $("outroEvento").classList.toggle("oculto", ev.id !== "outro");
      if (ev.id === "outro") $("outroEvento").focus();
      if (ev.data) $("data").value = ev.data;
      validar();
    };
    lista.appendChild(el);
  });
  validar();
}

function eventoEscolhido(){
  const marcado = document.querySelector('input[name=evento]:checked');
  if (!marcado) return "";
  if (marcado.value === "outro") return $("outroEvento").value.trim();
  return (eventos.find(e => String(e.id) === marcado.value) || {}).nome || "";
}

function validar(){
  const pendentes = fotos.filter(f => f.estado !== "enviada").length;
  $("btnEnviar").disabled = !($("autor").value.trim() && eventoEscolhido() && $("data").value && pendentes);
  $("btnEnviar").textContent = pendentes ? `Enviar ${pendentes} foto${pendentes > 1 ? "s" : ""}` : "Enviar fotos";
  $("contagem").textContent = fotos.length ? `${fotos.length} foto${fotos.length > 1 ? "s" : ""} escolhida${fotos.length > 1 ? "s" : ""}` : "";
}
["autor","outroEvento","data"].forEach(id => $(id).addEventListener("input", validar));

$("btnEscolher").onclick = () => $("arquivos").click();
$("arquivos").onchange = e => {
  for (const file of e.target.files) fotos.push({file, url:URL.createObjectURL(file), estado:"nova"});
  e.target.value = "";
  desenharPrevias(); validar();
};

function desenharPrevias(){
  const box = $("previas"); box.innerHTML = "";
  fotos.forEach((f, i) => {
    const d = document.createElement("div");
    d.className = "previa " + (f.estado === "enviada" ? "enviada" : f.estado === "falhou" ? "falhou" : "");
    d.innerHTML = `<img src="${f.url}" alt="">` + (f.estado === "enviada" ? "" : `<button aria-label="Remover foto">×</button>`);
    const b = d.querySelector("button");
    if (b) b.onclick = () => { URL.revokeObjectURL(f.url); fotos.splice(i,1); desenharPrevias(); validar(); };
    box.appendChild(d);
  });
}

function lerBase64(file){
  return new Promise((ok, falhou) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1]);
    r.onerror = () => falhou(r.error);
    r.readAsDataURL(file);
  });
}

$("btnEnviar").onclick = async () => {
  const autor = $("autor").value.trim(), evento = eventoEscolhido(), data = $("data").value;
  memoria.set("autor", autor);
  $("erroForm").classList.add("oculto");
  $("btnEnviar").disabled = true; $("btnEscolher").disabled = true;
  $("progresso").classList.remove("oculto");
  const fila = fotos.filter(f => f.estado !== "enviada");
  let feitas = 0, ultimoErro = "", recusado = false;
  for (const f of fila) {
    $("textoProgresso").textContent = `Enviando ${feitas + 1} de ${fila.length}...`;
    try {
      const r = await api({
        acao: "enviar", codigo: codigoAtual, autor, evento, data, descricao: $("descricao").value.trim(),
        nome: f.file.name || "foto.jpg", tipo: f.file.type || "image/jpeg", base64: await lerBase64(f.file)
      });
      if (r.ok) f.estado = "enviada";
      else { f.estado = "falhou"; ultimoErro = r.erro || "Falha no envio."; if (r.status === 403) recusado = true; }
    } catch (e) { f.estado = "falhou"; ultimoErro = "Falha de conexão com o acervo. Verifique a internet."; }
    feitas++;
    $("barra").style.width = (feitas / fila.length * 100) + "%";
    desenharPrevias();
    if (recusado) break;
  }
  $("btnEscolher").disabled = false;
  $("progresso").classList.add("oculto"); $("barra").style.width = "0";
  const falhas = fotos.filter(f => f.estado === "falhou").length;
  const ok = fila.filter(f => f.estado === "enviada").length;
  if (recusado) {
    memoria.del("codigo"); codigoAtual = "";
    $("erroCodigo").textContent = "O código de acesso mudou. Confira com a secretaria ou leia o QR Code novo.";
    $("erroCodigo").classList.remove("oculto"); mostrar("telaCodigo");
  } else if (!falhas) {
    $("textoFim").textContent = `${ok} foto${ok > 1 ? "s enviadas" : " enviada"}.`;
    mostrar("telaFim");
  } else {
    $("erroForm").textContent = `${falhas} foto${falhas > 1 ? "s não foram enviadas" : " não foi enviada"}. ${ultimoErro} Toque em Enviar para tentar de novo.`;
    $("erroForm").classList.remove("oculto");
  }
  validar();
};

$("btnMais").onclick = () => {
  fotos.forEach(f => URL.revokeObjectURL(f.url)); fotos = [];
  $("descricao").value = ""; desenharPrevias(); validar(); mostrar("telaForm"); scrollTo(0,0);
};
$("btnSair").onclick = () => { memoria.del("codigo"); codigoAtual = ""; $("codigo").value = ""; mostrar("telaCodigo"); };

iniciar();
</script>
</body>
</html>
